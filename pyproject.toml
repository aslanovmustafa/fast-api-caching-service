[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cache-service"
version = "0.0.1"
description = "FastAPI caching service"
authors = [{ name = "Mustafa Aslanov", email = "aslanovmustafa@yahoo.com"}]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "SQLAlchemy>=2.0,<2.1",
    "pydantic>=2.14.0,<2.15",
    "pydantic-settings>=2.10,<3",
    "httpx>=0.28,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "ruff>=0.11,<1"
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I"
]